name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    environment: dev
    runs-on: ubuntu-24.04
    steps:
      - name: PR Cleanup
        uses: bcgov/actions-openshift/cleanup-pr@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7
        with:
          target: ${{ github.event.number }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.oc_server }}

      - name: Remove PR-specific Crunchy database and user
        if: ${{ always() && vars.DB_TYPE == 'crunchy' }}
        uses: bcgov/action-crunchy@v2.0.0 #consider updating to the following to match the reusable-deploy: bcgov/actions-openshift/crunchy@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.oc_server }}
          values_file: common/crunchy-values.yml
          release_name: pg-${{ github.event.repository.name }}-dev
