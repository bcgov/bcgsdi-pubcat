# Reusable Deploy - Lite Mode Verification
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string
      crunchy_values_file:
        description: "Crunchy configuration file, used when DB_TYPE is crunchy"
        type: string
        default: common/crunchy-values.yml
      db_schema:
        description: Database schema used for the application
        type: string
        required: true
      backend_port:
        description: Port used for the backend
        type: string
        default: 3000
      seed_sample_data:
        description: "Load synthetic sample data into the database (only for dev and test deployments)"
        type: boolean
        default: false

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
      db_password:
        description: Database password for vanilla PostgreSQL; not needed for Crunchy, which manages its own passwords.
        required: false
      s3_access_key:
        description: S3 access key for Crunchy backups
        required: false
      s3_secret_key:
        description: S3 secret key for Crunchy backups
        required: false
      s3_bucket:
        description: S3 bucket for Crunchy backups
        required: false
      s3_endpoint:
        description: S3 endpoint for Crunchy backups
        required: false

    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

jobs:
  init:
    name: Deploy (init)
    environment: ${{ inputs.environment }}
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
      db_host: ${{ steps.db_connection.outputs.db_host }}
      db_port: ${{ steps.db_connection.outputs.db_port }}
      db_secret_name: ${{ steps.db_connection.outputs.db_secret_name }}
      db_name_key: ${{ steps.db_connection.outputs.db_name_key }}
      db_user_key: ${{ steps.db_connection.outputs.db_user_key }}
      db_password_key: ${{ steps.db_connection.outputs.db_password_key }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate database type
        env:
          DB_TYPE: ${{ vars.DB_TYPE }}
        run: |
          if [[ "$DB_TYPE" != "postgres" && "$DB_TYPE" != "crunchy" ]]; then
            echo "::error::Invalid or missing DB_TYPE '$DB_TYPE'. Valid options: postgres, crunchy."
            exit 1
          fi

      - name: Set database connection parameters
        id: db_connection
        env:
          DB_TYPE: ${{ vars.DB_TYPE }}
          REPO_NAME: ${{ github.event.repository.name }}
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "$DB_TYPE" == "crunchy" ]]; then
            echo "db_host=pg-${REPO_NAME}-${TARGET}-crunchy-pgbouncer" >> "$GITHUB_OUTPUT"
            echo "db_secret_name=pg-${REPO_NAME}-${TARGET}-crunchy-pguser-app-${TARGET}" >> "$GITHUB_OUTPUT"
            echo "db_name_key=dbname" >> "$GITHUB_OUTPUT"
            echo "db_user_key=user" >> "$GITHUB_OUTPUT"
            echo "db_password_key=password" >> "$GITHUB_OUTPUT"
          else
            echo "db_host=${REPO_NAME}-${TARGET}-database" >> "$GITHUB_OUTPUT"
            echo "db_secret_name=${REPO_NAME}-${TARGET}-database" >> "$GITHUB_OUTPUT"
            echo "db_name_key=database-name" >> "$GITHUB_OUTPUT"
            echo "db_user_key=database-user" >> "$GITHUB_OUTPUT"
            echo "db_password_key=database-password" >> "$GITHUB_OUTPUT"
          fi

          echo "db_port=5432" >> "$GITHUB_OUTPUT"

      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        id: deploy
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          # Secret + NetworkPolicies: create if missing.
          overwrite: false
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
          triggers: ${{ inputs.triggers }}
          debug: true

  database:
    name: Deploy database
    environment: ${{ inputs.environment }}
    needs: [init]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize vanilla PostgreSQL resources
        if: ${{ vars.DB_TYPE == 'postgres' }}
        uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        env:
          DB_PASSWORD: ${{ secrets.db_password }}
        with:
          file: common/openshift.postgres.init.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: false
          # TODO: Is there a better way to pass DB_PASSWORD so the deployer action
          # can inject it as an environment variable into the YAML template?
          parameters: -p DB_PASSWORD="${{ secrets.db_password }}"
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
          triggers: ${{ inputs.triggers }}
          debug: true

      - name: Deploy vanilla PostgreSQL
        if: ${{ vars.DB_TYPE == 'postgres' }}
        uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: common/openshift.postgres.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: true
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p DB_PVC_SIZE="256Mi"
            -p PG_IMAGE_TAG="postgis/postgis:17-3.6"
          triggers: ${{ inputs.triggers }}

      - name: Deploy Crunchy PostgreSQL
        if: ${{ vars.DB_TYPE == 'crunchy' }}
        uses: bcgov/actions-openshift/crunchy@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          s3_access_key: ${{ secrets.s3_access_key }}
          s3_secret_key: ${{ secrets.s3_secret_key }}
          s3_bucket: ${{ secrets.s3_bucket }}
          s3_endpoint: ${{ secrets.s3_endpoint }}
          values_file: ${{ inputs.crunchy_values_file }}
          release_name: pg-${{ github.event.repository.name }}-${{ inputs.target }}
          triggers: ${{ inputs.triggers }}

  env-setup:
    name: Environment setup (${{ matrix.name }})
    environment: ${{ inputs.environment }}
    needs: [init, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - name: backend
            file: backend/openshift.env.yml
            parameters: -p LOG_LEVEL="info"
              -p PORT="${{ inputs.backend_port }}"
              -p DB_SCHEMA="${{ inputs.db_schema }}"
          - name: frontend-public
            file: frontend-public/openshift.env.yml
            parameters: -p LOG_LEVEL="info"

    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        id: deploy
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: true
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            ${{ matrix.parameters }}
          triggers: ${{ inputs.triggers }}

  deploy:
    name: Deploy (${{ matrix.name }})
    environment: ${{ inputs.environment }}
    needs: [init, database, env-setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: backend
            file: backend/openshift.deploy.yml
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
          - name: frontend-public
            file: frontend-public/openshift.deploy.yml
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        id: deploy
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: true
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            ${{ matrix.parameters }}
            ${{ matrix.name == 'backend' && format('-p DB_HOST="{0}" -p DB_PORT="{1}" -p DB_SECRET_NAME="{2}" -p DB_NAME_KEY="{3}" -p DB_USER_KEY="{4}" -p DB_PASSWORD_KEY="{5}"', needs.init.outputs.db_host, needs.init.outputs.db_port, needs.init.outputs.db_secret_name, needs.init.outputs.db_name_key, needs.init.outputs.db_user_key, needs.init.outputs.db_password_key) || '' }}
          triggers: ${{ inputs.triggers }}

  seed:
    name: Seed sample data
    if: ${{ inputs.seed_sample_data && needs.deploy.result == 'success' }}
    environment: ${{ inputs.environment }}
    needs: [init, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Seed sample data
        uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: seed/openshift.seed.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: true
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p IMAGE_TAG="${{ inputs.tag }}"
            -p RUN_ID="${{ github.run_id }}"
            -p DB_HOST="${{ needs.init.outputs.db_host }}"
            -p DB_PORT="${{ needs.init.outputs.db_port }}"
            -p DB_SECRET_NAME="${{ needs.init.outputs.db_secret_name }}"
            -p DB_NAME_KEY="${{ needs.init.outputs.db_name_key }}"
            -p DB_USER_KEY="${{ needs.init.outputs.db_user_key }}"
            -p DB_PASSWORD_KEY="${{ needs.init.outputs.db_password_key }}"
          triggers: ${{ inputs.triggers }}
