# Reusable Deploy - Lite Mode Verification
name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, test or prod
        default: ${{ github.event.number }}
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment
        default: ""
        type: string
      db_type:
        description: "Type of database to deploy.  Supported options are: postgres, crunchy"
        type: string
        default: postgres
      crunchy_values_file:
        description: "Only needed if db_type == 'crunchy' and the default values file is not sufficient"
        type: string
        default: common/crunchy-values.yml
      db_schema:
        description: "Database schema of used for the application"
        type: string
        default: public
      backend_port:
        description: "Port used for the backend"
        type: string
        default: 3000

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
      db_password:
        description: Database password to be used when db_type == 'postgres'. Not needed for crunchy, which manages its own passwords.
        required: false
      s3_access_key:
        description: S3 access key for Crunchy backups
        required: false
      s3_secret_key:
        description: S3 secret key for Crunchy backups
        required: false
      s3_bucket:
        description: S3 bucket for Crunchy backups
        required: false
      s3_endpoint:
        description: S3 endpoint for Crunchy backups
        required: false
    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.init.outputs.triggered }}

permissions: {}

jobs:
  init:
    name: Deploy (init)
    environment: ${{ inputs.environment }}
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate database type
        env:
          DB_TYPE: ${{ inputs.db_type }}
        run: |
          if [[ "$DB_TYPE" != "postgres" && "$DB_TYPE" != "crunchy" ]]; then
            echo "::error::Invalid db_type '$DB_TYPE'. Valid options: postgres, crunchy."
            exit 1
          fi
      - uses: bcgov/action-deployer-openshift@27a85b7b157bfc9c3c9bf0aca53bcd288d4d2506 # v4.2.1
        id: deploy
        with:
          file: common/openshift.init.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          # Secret + NetworkPolicies: create if missing.
          overwrite: false
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
          triggers: ${{ inputs.triggers }}
          debug: true

  database:
    name: Deploy database (${{ inputs.db_type }})
    environment: ${{ inputs.environment }}
    needs: [init]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize vanilla PostgreSQL resources
        if: inputs.db_type == 'postgres'
        uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        env:
          DB_PASSWORD: ${{ secrets.db_password }}
        with:
          file: common/openshift.postgres.init.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          overwrite: false
          # todo: is there a better way to pass the db_password, so the deployer action
          # can inject it as an environment variable into the yml template?
          parameters: -p DB_PASSWORD="${{ secrets.db_password }}"
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
          triggers: ${{ inputs.triggers }}
          debug: true

      - name: Deploy vanilla PostgreSQL
        if: inputs.db_type == 'postgres'
        uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          file: common/openshift.postgres.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: true
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p DB_PVC_SIZE="256Mi"
            -p PG_IMAGE_TAG="postgis/postgis:17-3.6"
          triggers: ${{ inputs.triggers }}

      - name: Deploy Crunchy PostgreSQL
        if: inputs.db_type == 'crunchy'
        uses: bcgov/actions-openshift/crunchy@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          s3_access_key: ${{ secrets.s3_access_key }}
          s3_secret_key: ${{ secrets.s3_secret_key }}
          s3_bucket: ${{ secrets.s3_bucket }}
          s3_endpoint: ${{ secrets.s3_endpoint }}
          values_file: ${{ inputs.crunchy_values_file }}
          release_name: pg-${{ github.event.repository.name }}-${{ inputs.target }}
          triggers: ${{ inputs.triggers }}

  env-setup:
    name: Environment setup (${{ matrix.name }})
    environment: ${{ inputs.environment }}
    needs: [init, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - name: backend
            file: backend/openshift.env.yml
            parameters: -p SAMPLE_SECRET="my secret"
              -p SAMPLE_NON_SECRET="my non-secret"
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        id: deploy
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: true
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            ${{ matrix.parameters }}
          triggers: ${{ inputs.triggers }}

  deploy:
    name: Deploy (${{ matrix.name }})
    environment: ${{ inputs.environment }}
    needs: [init, database, env-setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: backend
            file: backend/openshift.deploy.yml
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
              -p PORT="${{ inputs.backend_port }}"
              -p DB_SCHEMA="${{ inputs.db_schema }}"
          - name: frontend-public
            file: frontend-public/openshift.deploy.yml
            parameters: -p IMAGE_TAG="${{ inputs.tag }}"
              -p DOMAIN="${{ vars.oc_server }}"
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: bcgov/actions-openshift/deployer@46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7 # v0.6.0
        id: deploy
        with:
          file: ${{ matrix.file }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: true
          parameters: -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            ${{ matrix.parameters }}
          triggers: ${{ inputs.triggers }}
