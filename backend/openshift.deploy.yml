apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: backend
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: DOMAIN
    value: apps.gold.devops.gov.bc.ca
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: '2'
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: '5'
  - name: CPU_REQUEST
    value: '100m'
  - name: MEMORY_REQUEST
    value: '128Mi'
  - name: MEMORY_LIMIT
    description: Memory limit for the container (bounds the pod's working set).
    value: '4Gi'
  - name: DB_HOST
    description: Database host or service name
    required: true
  - name: DB_PORT
    description: Database service port
    value: '5432'
  - name: DB_SECRET_NAME
    description: Secret containing database credentials
    required: true
  - name: DB_NAME_KEY
    description: Secret key containing the database name
    required: true
  - name: DB_USER_KEY
    description: Secret key containing the database username
    required: true
  - name: DB_PASSWORD_KEY
    description: Secret key containing the database password
    required: true
  - name: LOG_LEVEL
    description: Application log level (debug|info|warn|error)
    value: 'info'
  - name: PORT
    description: Port for the component to run on
    type: integer
    value: '3000'
  - name: DB_SCHEMA
    description: Database schema used by the application
    value: 'users'
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        deployment: ${NAME}-${ZONE}-${COMPONENT}
                    topologyKey: kubernetes.io/hostname
          initContainers:
            - name: wait-for-db
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/migrations:${IMAGE_TAG}
              command:
                - /bin/sh
                - -c
                - |
                  echo "Waiting for database to be reachable..."
                  max_retries=30
                  attempt=1
                  until nc -z -v -w3 ${DB_HOST} ${DB_PORT}; do
                    if [ "$attempt" -ge "$max_retries" ]; then
                      echo "ERROR: Database ${DB_HOST}:${DB_PORT} is not reachable after ${max_retries} attempts." >&2
                      exit 1
                    fi
                    echo "Database not ready (attempt ${attempt}/${max_retries}), sleeping..."
                    attempt=$((attempt + 1))
                    sleep 2
                  done
                  echo "Database is UP!"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ['ALL']
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
            - name: migrations
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/migrations:${IMAGE_TAG}
              imagePullPolicy: Always
              env:
                - name: POSTGRES_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_SECRET_NAME}
                      key: ${DB_NAME_KEY}
                - name: FLYWAY_URL
                  value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/$(POSTGRES_DATABASE)
                - name: FLYWAY_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_SECRET_NAME}
                      key: ${DB_USER_KEY}
                - name: FLYWAY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_SECRET_NAME}
                      key: ${DB_PASSWORD_KEY}
                - name: FLYWAY_DEFAULT_SCHEMA
                  value: '${DB_SCHEMA}'
                - name: FLYWAY_BASELINE_ON_MIGRATE
                  value: 'true'
              resources:
                requests:
                  cpu: 10m
                  memory: 50Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ['ALL']
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: ${{PORT}}
              envFrom:
                - secretRef:
                    name: ${NAME}-${ZONE}-${COMPONENT}
                - configMapRef:
                    name: ${NAME}-${ZONE}-${COMPONENT}
              env:
                - name: DB_HOST
                  value: ${DB_HOST}
                - name: DB_PORT
                  value: ${DB_PORT}
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_SECRET_NAME}
                      key: ${DB_NAME_KEY}
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_SECRET_NAME}
                      key: ${DB_USER_KEY}
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${DB_SECRET_NAME}
                      key: ${DB_PASSWORD_KEY}
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                limits:
                  memory: ${MEMORY_LIMIT}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ['ALL']
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              startupProbe:
                httpGet:
                  path: /api/health
                  port: http
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: http
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: http
                periodSeconds: 10
                failureThreshold: 3
              lifecycle:
                preStop:
                  exec:
                    # distroless/nodejs has no /bin/sleep; exec hooks skip image ENTRYPOINT
                    command: ['/nodejs/bin/node', '-e', 'setTimeout(() => {}, 10000)']
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: ${PORT}
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
          selectPolicy: Max
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
