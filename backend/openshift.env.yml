apiVersion: template.openshift.io/v1
kind: Template

# List all environment variables used by the backend in this file.
# Each should appear in the 'parameters' section, and then
# also in either the secret or the config map as appropriate.

parameters:
  - name: NAME
    description: Module name
    required: true
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: COMPONENT
    description: Component name
    value: backend
  - name: PORT
    description: Port to run the component on
    required: true
  - name: DB_SCHEMA
    description: Database schema
    required: true
  - name: LOG_LEVEL
    description: Log level
    required: true

objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}
      labels:
        app: ${NAME}-${ZONE}
    type: Opaque
    stringData:
      DB_SCHEMA: ${DB_SCHEMA}

  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}
      labels:
        app: ${NAME}-${ZONE}
    data:
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: ${PORT}
