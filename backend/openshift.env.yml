apiVersion: template.openshift.io/v1
kind: Template

parameters:
  - name: NAME
    description: Module name
    required: true
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: SAMPLE_SECRET
    description: Sample secret
    required: false
  - name: SAMPLE_NON_SECRET
    description: Sample non-secret
    required: false

objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-backend-secret
      labels:
        app: ${NAME}-${ZONE}
    type: Opaque
    stringData:
      SAMPLE_SECRET: ${SAMPLE_SECRET}

  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-backend-config
      labels:
        app: ${NAME}-${ZONE}
    data:
      SAMPLE_NON_SECRET: ${SAMPLE_NON_SECRET}
