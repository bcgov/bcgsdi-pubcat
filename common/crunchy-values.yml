# Helm values overrides for the Crunchy chart.
# Overrides defaults here:
# https://github.com/bcgov/actions-openshift/blob/46f2614322f7ba1a5ad88a7e4e1b98569c80dcf7/crunchy/values.yml

global:
  config:
    dbName: app

crunchy:
  enabled: true
  postgresVersion: 18
  postGISVersion: "3.6"

  instances:
    replicas: 3
    dataVolumeClaimSpec:
      storage: 1Gi
      storageClassName: netapp-block-standard
      walStorage: 420Mi

  bootstrapFromBackup:
    enabled: false
    fromRepoName: ~
    targetTime: ~
    stanza: db

  restore:
    enabled: false
    repoName: ~
    target: ~

  requests:
    cpu: 50m
    memory: 128Mi

  replicaCertCopy:
    requests:
      cpu: 1m
      memory: 32Mi

  pgBackRest:
    enabled: false
