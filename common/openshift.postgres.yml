apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    required: true
  - name: COMPONENT
    description: Component name
    value: database
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: PG_IMAGE_TAG
    description: PostgreSQL version tag for the Docker Hub postgres image
    value: "postgres:17"
  - name: DB_PVC_SIZE
    description: Volume space available for data
    value: 256Mi
  - name: MEMORY_LIMIT
    description: Memory limit for the database container (bounds the pod's working set).
    value: 4Gi

objects:
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      # Governing Service required by the StatefulSet.
      serviceName: ${NAME}-${ZONE}-${COMPONENT}
      replicas: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          # Give Postgres time to flush and shut down cleanly on SIGTERM during a node drain.
          terminationGracePeriodSeconds: 60
          containers:
            - name: ${NAME}-${ZONE}
              image: ${PG_IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - containerPort: 5432
              env:
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
                # FORCES the Postgres Engine to write its Unix socket to /tmp
                - name: PGOPTIONS
                  value: "-c unix_socket_directories=/tmp"
                # Tells local client defaults to search /tmp natively
                - name: PGHOST
                  value: /tmp
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-name
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-password
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-user

              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data

              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: ${MEMORY_LIMIT}

              # restricted-v2 SCC hardening compliance
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault

              # Health probes configured to monitor the accessible /tmp socket directory
              readinessProbe:
                exec:
                  command:
                    - pg_isready
                    - -h
                    - /tmp
                successThreshold: 1
                failureThreshold: 5
                initialDelaySeconds: 15
                periodSeconds: 15
                timeoutSeconds: 10
              livenessProbe:
                exec:
                  command:
                    - pg_isready
                    - -h
                    - /tmp
                successThreshold: 1
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 10
          volumes: []

      # Per-pod NetApp block storage PVC managed by the StatefulSet
      volumeClaimTemplates:
        - metadata:
            labels:
              app: ${NAME}-${ZONE}
            name: data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: netapp-block-standard
            resources:
              requests:
                storage: ${DB_PVC_SIZE}

  # ClusterIP Service: the backend connects here via ${NAME}-${ZONE}-${COMPONENT}:5432.
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: postgresql
          port: 5432
          targetPort: 5432
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
