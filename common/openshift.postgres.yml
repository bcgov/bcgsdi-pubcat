apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    required: true
  - name: COMPONENT
    description: Component name
    value: database
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: PG_IMAGE_TAG
    description: PostgreSQL version tag for the Docker Hub postgres image
    value: "postgres:17"
  - name: DB_PVC_SIZE
    description: Volume space available for data
    value: 256Mi
  - name: MEMORY_LIMIT
    description: Memory limit for the database container (bounds the pod's working set).
    value: 4Gi

objects:
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      serviceName: ${NAME}-${ZONE}-${COMPONENT}
      replicas: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 60
          containers:
            - name: ${NAME}-${ZONE}
              image: ${PG_IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - containerPort: 5432
              env:
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
                - name: PGHOST
                  value: /tmp
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-name
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-password
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-user
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
              resources:
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  memory: ${MEMORY_LIMIT}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              readinessProbe:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - pg_isready -h 127.0.0.1 -d "$POSTGRES_DB" -U "$POSTGRES_USER"
                successThreshold: 1
                failureThreshold: 5
                initialDelaySeconds: 15
                periodSeconds: 15
                timeoutSeconds: 10
              livenessProbe:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - pg_isready -h 127.0.0.1 -d "$POSTGRES_DB" -U "$POSTGRES_USER"
                successThreshold: 1
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 10
          volumes: []

      # Volume Claim and Service Configurations remain completely unchanged...
      volumeClaimTemplates:
        - metadata:
            labels:
              app: ${NAME}-${ZONE}
            name: data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: netapp-block-standard
            resources:
              requests:
                storage: ${DB_PVC_SIZE}
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: postgresql
          port: 5432
          targetPort: 5432
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
