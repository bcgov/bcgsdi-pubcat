# Reusable vars
x-var:
  - &POSTGRES_USER pubcat
  - &POSTGRES_PASSWORD pubcat
  - &POSTGRES_DATABASE pubcat
  - &POSTGRES_URL jdbc:postgresql://database:5432/pubcat
  - &node-image node:22

# Reusable envars for postgres
x-postgres-vars: &postgres-vars
  POSTGRES_HOST: database
  POSTGRES_USER: *POSTGRES_USER
  POSTGRES_PASSWORD: *POSTGRES_PASSWORD
  POSTGRES_DATABASE: *POSTGRES_DATABASE

services:
  database:
    image: postgis/postgis:17-3.4 # if using crunchy , make sure to align with crunchy version, currently it is at 16 and postgis 3.3
    environment:
      <<: *postgres-vars
    healthcheck:
      test: ["CMD", "pg_isready", "-U", *POSTGRES_USER]
    ports: ["5432:5432"]

  migrations:
    image: flyway/flyway:13-alpine
    command: -connectRetries=10 info migrate info
    volumes: ["./migrations/sql:/flyway/sql:ro"]
    environment:
      FLYWAY_URL: *POSTGRES_URL
      FLYWAY_USER: *POSTGRES_USER
      FLYWAY_PASSWORD: *POSTGRES_PASSWORD
      FLYWAY_BASELINE_ON_MIGRATE: true
      FLYWAY_DEFAULT_SCHEMA: *POSTGRES_DATABASE
      #FLYWAY_LOCATIONS: filesystem:/flyway/sql
    depends_on:
      database:
        condition: service_healthy

  schemaspy:
    image: schemaspy/schemaspy:7.0.2
    profiles: ["schemaspy"]
    container_name: schemaspy
    command: -t pgsql11 -db postgres -host database -port 5432 -u postgres -p default -schemas users
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes: ["./output:/output"]

  backend:
    build:
      context: ./backend
    depends_on:
      migrations:
        condition: service_started
    environment:
      <<: *postgres-vars
      NODE_ENV: development
    ports: ["3001:3001"]
    volumes: ["./backend:/app", "/app/node_modules"]

  frontend-public:
    build:
      context: ./frontend-public
    environment:
      #  BACKEND_URL: http://backend:3001
      NODE_ENV: development
      LOG_LEVEL: DEBUG
    ports: ["3000:3000"]
    #volumes: ["./frontend-public:/app", "/app/node_modules"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
    #working_dir: "/app"
    #depends_on:
    #  backend:
    #    condition: service_healthy

  caddy:
    profiles: ["caddy"]
    build: ./frontend
    environment:
      NODE_ENV: development
      PORT: 3000
      BACKEND_URL: http://backend:3000
      LOG_LEVEL: info
    ports: ["3005:3000"]
    volumes: ["./frontend/Caddyfile:/etc/caddy/Caddyfile"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
    depends_on:
      backend:
        condition: service_healthy
