apiVersion: template.openshift.io/v1
kind: Template

# List all environment variables used by frontend-public in this file.
# Each should appear in the 'parameters' section, and then
# also in either the secret or the config map as appropriate.

parameters:
  - name: NAME
    description: Module name
    required: true
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: COMPONENT
    description: Component name
    value: backend
  - name: LOG_LEVEL
    description: Sample secret
    required: false
    default: INFO
  - name: BACKEND_URL
    description: URL that the frontend communicates with when proxying api requests to the backend
    required: true

objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}
      labels:
        app: ${NAME}-${ZONE}
    type: Opaque
    stringData:
      SAMPLE_SECRET: ${SAMPLE_SECRET}

  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-${COMPONENT}
      labels:
        app: ${NAME}-${ZONE}
    data:
      LOG_LEVEL: ${LOG_LEVEL}
      BACKEND_URL: ${BACKEND_URL}
