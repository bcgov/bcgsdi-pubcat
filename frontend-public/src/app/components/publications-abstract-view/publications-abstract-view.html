@if(publications()?.length) {
<div class="flex flex-col">
  @for (publication of publications(); track publication.publication_guid; let index = $index) {
  <pubcat-publication-card [publication]="publication" [showThumbnail]="false" [showDownloads]="false"
    [showSeries]="false" [showKeywords]="false" [showMap]="false" class="p-4"
    [routerLink]="['/publications', publication.publication_guid]"></pubcat-publication-card>
  @if(index + 1 != publications()?.length) {
  <hr>
  }
  }
</div>
}
