@if(publications()?.length) {
<table mat-table [dataSource]="publications()!" matSort>
  <!-- Author Column -->
  <ng-container matColumnDef="author">
    <th mat-header-cell *matHeaderCellDef>Author</th>
    <td mat-cell *matCellDef="let element">{{element.originator}}</td>
  </ng-container>

  <!-- Publication Year Column -->
  <ng-container matColumnDef="publication_year">
    <th mat-header-cell *matHeaderCellDef>Year</th>
    <td mat-cell *matCellDef="let element">{{element.publication_year}}</td>
  </ng-container>

  <!-- Title Column -->
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Title</th>
    <td mat-cell *matCellDef="let element">{{element.title}}</td>
  </ng-container>

  <!-- Issue Column -->
  <ng-container matColumnDef="issue_id">
    <th mat-header-cell *matHeaderCellDef>Issue</th>
    <td mat-cell *matCellDef="let element">{{element.issue_id}}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
}
