@if (publications()?.length) {
  <table
    mat-table
    [dataSource]="publications()!"
    [matSortActive]="activeSortField"
    [matSortDirection]="activeSortDirection"
    matSort
    matSortDisableClear
    (matSortChange)="onSortChanged($event)"
  >
    <!-- Author Column -->
    <ng-container matColumnDef="author">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by author">
        Author
      </th>
      <td mat-cell *matCellDef="let publication">{{ publication.originator }}</td>
    </ng-container>

    <!-- Publication Year Column -->
    <ng-container matColumnDef="publication_year">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        start="desc"
        class="hidden md:table-cell"
        sortActionDescription="Sort by publication year"
      >
        Year
      </th>
      <td mat-cell *matCellDef="let publication" class="hidden md:table-cell">
        {{ publication.publication_year }}
      </td>
    </ng-container>

    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by title">
        Title
      </th>
      <td mat-cell *matCellDef="let publication">
        <b>{{ publication.title }}</b>
      </td>
    </ng-container>

    <!-- Issue Column -->
    <ng-container matColumnDef="issue_id">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        sortActionDescription="Sort by issue identifier"
      >
        Issue
      </th>
      <td mat-cell *matCellDef="let publication" class="text-nowrap">
        {{ publication.issue_identification }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let publication; columns: displayedColumns"
      [routerLink]="['/publications', publication.publication_guid]"
    ></tr>
  </table>
}
