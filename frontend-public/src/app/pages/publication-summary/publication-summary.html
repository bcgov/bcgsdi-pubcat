<div class="flex flex-col h-full min-h-0">
  <div class="flex justify-between items-center mb-4 shrink-0">
    <div class="flex items-center gap-2">
      @if (navigationService.canGoBack) {
      <button matIconButton (click)="navigationService.back()">
        <mat-icon matListItemIcon class="mr-2"> chevron_left </mat-icon>
      </button>
      }
      <h3>Publication Summary</h3>
    </div>

    <button mat-flat-button class="hidden! sm:block! btn-secondary" (click)="newSearch()">
      <span>Search the catalogue</span>
    </button>

    <button matIconButton class="block! sm:hidden! mr-2" (click)="newSearch()">
      <mat-icon matListItemIcon> search </mat-icon>
    </button>
  </div>
  @if (publication.isLoading()) {
  <p>Loading...</p>
  } @else if (publication.error()) {
  <p>Unable to load publication.</p>
  } @else if (publication.value(); as item) {
  <pubcat-publication-card [publication]="item"></pubcat-publication-card>
  }
</div>
