apiVersion: template.openshift.io/v1
kind: Template

parameters:
  - name: NAME
    description: Product name
    required: true
  - name: ZONE
    description: Deployment zone
    required: true
  - name: IMAGE_TAG
    description: Container image tag
    required: true
  - name: RUN_ID
    description: Unique GitHub Actions run ID
    required: true
  - name: REGISTRY
    value: ghcr.io
  - name: ORG_NAME
    value: bcgov

objects:
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: ${NAME}-${ZONE}-seed-${RUN_ID}
      labels:
        app: ${NAME}-${ZONE}
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-backend
        spec:
          restartPolicy: Never
          containers:
            - name: seed
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/seed:${IMAGE_TAG}
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  echo "Checking whether the publication table is empty..."

                  has_publications=$(psql \
                    -v ON_ERROR_STOP=1 \
                    -tA \
                    -c 'SELECT EXISTS (
                      SELECT 1 FROM pubcat.publication LIMIT 1
                    )')

                  if [ "$has_publications" = "f" ]; then
                    echo "Publication table is empty; loading sample data."
                    psql -v ON_ERROR_STOP=1 -f /seed/sample-data.sql
                    echo "Sample data loaded successfully."
                  else
                    echo "Publication table is not empty; skipping sample data."
                  fi
              env:
                - name: PGHOST
                  value: ${NAME}-${ZONE}-database
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-name
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-user
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-password
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
